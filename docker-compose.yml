
services:
  mysql:
    image: mysql:8.4
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: landlorddb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  python:
    image: python:3.12-slim
    container_name: python-client
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install mysql-connector-python && python database.py"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
